<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pencarian Data Siswa - UPTD SPF SMP Negeri 1 Bondowoso</title>
    
    <!-- Favicon Google Drive -->
    <link rel="icon" type="image/png" href="https://drive.google.com/thumbnail?id=1WW8IClnvrY9d5a16vhFRSeHcvUOIlEI2&sz=w128">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome & jsPDF -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        smp: {
                            blue: '#1e3a8a',
                            light: '#3b82f6',
                            accent: '#f59e0b'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .glass-panel { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen flex flex-col text-slate-800">

    <!-- Loading Overlay (Z-Index 9999) -->
    <div id="loadingOverlay" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[9999] hidden flex-col items-center justify-center transition-all">
        <div class="bg-white p-6 rounded-2xl shadow-2xl flex flex-col items-center max-w-xs w-full mx-4">
            <div class="animate-spin rounded-full h-12 w-12 border-4 border-smp-blue border-t-smp-light mb-4"></div>
            <p class="text-slate-800 font-bold text-base text-center" id="loadingText">Mencari Data Siswa...</p>
            <p class="text-slate-400 text-xs text-center mt-1">Mengambil data dari server</p>
        </div>
    </div>

    <!-- Toast Notification Container (Z-Index 2000) -->
    <div id="toastContainer" class="fixed top-5 right-5 z-[2000] flex flex-col gap-3 max-w-sm w-full px-4 sm:px-0"></div>

    <!-- Main Content -->
    <main class="flex-grow container mx-auto px-4 py-6 max-w-5xl">
        
        <!-- Header Branding & Kop Sekolah -->
        <div class="w-full bg-white rounded-2xl shadow-md overflow-hidden mb-6 border border-slate-200">
            <img src="https://drive.google.com/thumbnail?id=118AwlcPy5cUV8qKCvjlhJmabX4p8iweM&sz=w1000" 
                 alt="Kop Surat SMP Negeri 1 Bondowoso" 
                 class="w-full h-auto object-cover max-h-[250px]"
                 onerror="this.src='https://placehold.co/1000x200/1e3a8a/white?text=UPTD+SPF+SMP+Negeri+1+Bondowoso'">
        </div>

        <!-- Search Panel -->
        <div class="glass-panel rounded-2xl shadow-sm border border-slate-200 p-5 sm:p-7 mb-8">
            <div class="text-center mb-6">
                <h2 class="text-2xl sm:text-3xl font-extrabold text-smp-blue tracking-tight">
                    <i class="fas fa-search text-smp-light mr-2"></i>Pencarian Data Siswa
                </h2>
                <p class="text-slate-500 text-xs sm:text-sm mt-1">Silakan pilih kategori pencarian dan masukkan kata kunci di bawah ini</p>
            </div>

            <form id="searchForm" class="space-y-5" onsubmit="event.preventDefault(); executeSearch();">
                
                <!-- Kategori Radio -->
                <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                    <label class="cursor-pointer relative">
                        <input type="radio" name="searchCategory" value="nis" class="peer sr-only" checked onchange="updatePlaceholder()">
                        <div class="p-3 text-center border rounded-xl peer-checked:bg-smp-blue peer-checked:text-white peer-checked:border-smp-blue peer-checked:shadow-sm hover:bg-slate-50 transition-all font-semibold text-xs sm:text-sm text-slate-600">
                            <i class="fas fa-hashtag mr-1"></i> NIS
                        </div>
                    </label>
                    <label class="cursor-pointer relative">
                        <input type="radio" name="searchCategory" value="nisn" class="peer sr-only" onchange="updatePlaceholder()">
                        <div class="p-3 text-center border rounded-xl peer-checked:bg-smp-blue peer-checked:text-white peer-checked:border-smp-blue peer-checked:shadow-sm hover:bg-slate-50 transition-all font-semibold text-xs sm:text-sm text-slate-600">
                            <i class="fas fa-id-badge mr-1"></i> NISN
                        </div>
                    </label>
                    <label class="cursor-pointer relative">
                        <input type="radio" name="searchCategory" value="nama" class="peer sr-only" onchange="updatePlaceholder()">
                        <div class="p-3 text-center border rounded-xl peer-checked:bg-smp-blue peer-checked:text-white peer-checked:border-smp-blue peer-checked:shadow-sm hover:bg-slate-50 transition-all font-semibold text-xs sm:text-sm text-slate-600">
                            <i class="fas fa-user mr-1"></i> Nama Siswa
                        </div>
                    </label>
                    <label class="cursor-pointer relative">
                        <input type="radio" name="searchCategory" value="kelas" class="peer sr-only" onchange="updatePlaceholder()">
                        <div class="p-3 text-center border rounded-xl peer-checked:bg-smp-blue peer-checked:text-white peer-checked:border-smp-blue peer-checked:shadow-sm hover:bg-slate-50 transition-all font-semibold text-xs sm:text-sm text-slate-600">
                            <i class="fas fa-door-open mr-1"></i> Kelas
                        </div>
                    </label>
                </div>

                <!-- Input & Submit Button -->
                <div class="flex flex-col md:flex-row gap-3">
                    <div class="relative flex-grow">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                            <i class="fas fa-keyboard"></i>
                        </div>
                        <input type="text" id="searchInput" required
                            class="w-full pl-11 pr-10 py-3.5 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-smp-light focus:border-smp-light outline-none transition-all text-slate-800 font-medium text-sm sm:text-base"
                            placeholder="Masukkan NIS Siswa...">
                        <button type="button" onclick="clearSearchInput()" id="btnClear" class="hidden absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600">
                            <i class="fas fa-times-circle"></i>
                        </button>
                    </div>
                    <button type="submit" class="bg-smp-blue hover:bg-blue-900 text-white font-bold py-3.5 px-8 rounded-xl shadow-md hover:shadow-lg transition-all flex items-center justify-center gap-2 active:scale-95 text-sm sm:text-base">
                        <i class="fas fa-search"></i> Cari Data
                    </button>
                </div>
            </form>
        </div>

        <!-- Results Section -->
        <div id="resultContainer" class="hidden">
            <!-- Header Hasil -->
            <div class="flex justify-between items-center mb-4 px-2">
                <h3 class="text-base sm:text-lg font-bold text-slate-700">
                    <i class="fas fa-list-check mr-2 text-smp-light"></i>Hasil Pencarian
                </h3>
                <span id="resultCount" class="bg-blue-100 text-smp-blue text-xs font-bold px-3 py-1 rounded-full border border-blue-200"></span>
            </div>

            <!-- Area untuk menampilkan daftar (Grid List) -->
            <div id="listView" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5 hidden"></div>

            <!-- Area untuk menampilkan detail tunggal (Kartu Siswa) -->
            <div id="detailView" class="hidden"></div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-6 mt-auto">
        <div class="container mx-auto px-4 text-center">
            <p class="text-slate-600 text-xs sm:text-sm font-medium">
                &copy; ariefcaturk ; &reg; UPTD SPF SMP Negeri 1 Bondowoso
            </p>
        </div>
    </footer>

    <script>
        // Endpoint Google Apps Script Web App
        const APP_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwoySVMbx4126OS5pWpO_GkBJjvtrpiNyZgFDJ_fmQA_Gpzj09-PsXEWVffQHf19V9Bfg/exec";
        
        let currentData = [];

        // Inisialisasi awal saat halaman dimuat
        document.addEventListener('DOMContentLoaded', () => {
            const searchInput = document.getElementById('searchInput');
            const btnClear = document.getElementById('btnClear');

            searchInput.addEventListener('input', () => {
                if (searchInput.value.trim() !== '') {
                    btnClear.classList.remove('hidden');
                } else {
                    btnClear.classList.add('hidden');
                }
            });
        });

        function clearSearchInput() {
            const searchInput = document.getElementById('searchInput');
            searchInput.value = '';
            document.getElementById('btnClear').classList.add('hidden');
            searchInput.focus();
        }

        // Tampilkan/Sembunyikan Overlay Loading
        function toggleLoading(show, text = "Mencari Data Siswa...") {
            const overlay = document.getElementById('loadingOverlay');
            const loadingText = document.getElementById('loadingText');
            if (show) {
                loadingText.innerText = text;
                overlay.classList.remove('hidden');
                overlay.classList.add('flex');
            } else {
                overlay.classList.add('hidden');
                overlay.classList.remove('flex');
            }
        }

        // Tampilkan Notifikasi Toast Modern
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            
            let bgClass = "bg-slate-800 text-white";
            let iconClass = "fa-info-circle text-blue-400";

            if (type === 'success') {
                bgClass = "bg-emerald-800 text-white border border-emerald-600";
                iconClass = "fa-check-circle text-emerald-300";
            } else if (type === 'error') {
                bgClass = "bg-rose-800 text-white border border-rose-600";
                iconClass = "fa-exclamation-triangle text-rose-300";
            }

            toast.className = `${bgClass} p-4 rounded-xl shadow-xl flex items-center justify-between gap-3 text-sm font-medium transition-all duration-300 transform translate-y-2 opacity-0`;
            toast.innerHTML = `
                <div class="flex items-center gap-3">
                    <i class="fas ${iconClass} text-lg"></i>
                    <span>${message}</span>
                </div>
                <button onclick="this.parentElement.remove()" class="text-white/70 hover:text-white">
                    <i class="fas fa-times"></i>
                </button>
            `;

            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        // Perbarui placeholder sesuai radio kategori yang dipilih
        function updatePlaceholder() {
            const category = document.querySelector('input[name="searchCategory"]:checked').value;
            const input = document.getElementById('searchInput');
            
            if (category === 'nis') {
                input.placeholder = "Masukkan NIS Siswa...";
            } else if (category === 'nisn') {
                input.placeholder = "Masukkan NISN Siswa (10 Digit)...";
            } else if (category === 'nama') {
                input.placeholder = "Masukkan Nama Siswa...";
            } else if (category === 'kelas') {
                input.placeholder = "Masukkan Kelas (Contoh: 7A, 8B, 9C)...";
            }
        }

        // Parser Jenis Kelamin Fleksibel
        function getGenderInfo(jkRaw) {
            if (!jkRaw || jkRaw === '-' || jkRaw.toString().trim() === '') {
                return {
                    text: '-',
                    icon: 'fa-venus-mars',
                    badgeClass: 'bg-slate-100 text-slate-600 border-slate-200'
                };
            }
            const val = jkRaw.toString().trim().toLowerCase();
            if (val.startsWith('p') || val.startsWith('w')) {
                return {
                    text: 'Perempuan',
                    icon: 'fa-venus',
                    badgeClass: 'bg-pink-100 text-pink-700 border-pink-200'
                };
            } else if (val.startsWith('l')) {
                return {
                    text: 'Laki-laki',
                    icon: 'fa-mars',
                    badgeClass: 'bg-blue-100 text-blue-700 border-blue-200'
                };
            } else {
                return {
                    text: jkRaw,
                    icon: 'fa-venus-mars',
                    badgeClass: 'bg-slate-100 text-slate-600 border-slate-200'
                };
            }
        }

        // Eksekusi Pencarian Data
        async function executeSearch() {
            const category = document.querySelector('input[name="searchCategory"]:checked').value;
            const keyword = document.getElementById('searchInput').value.trim();

            if (!keyword) {
                showToast("Silakan masukkan kata kunci pencarian!", "error");
                return;
            }

            toggleLoading(true, "Mencari Data Siswa...");

            try {
                // Gunakan URLSearchParams untuk GET Request (Mencegah masalah CORS pada Apps Script)
                const searchUrl = `${APP_SCRIPT_URL}?action=search&category=${encodeURIComponent(category)}&keyword=${encodeURIComponent(keyword)}`;
                
                const response = await fetch(searchUrl);
                const result = await response.json();

                if (result.success) {
                    currentData = result.data || [];
                    displayResults(currentData, category);
                    if (currentData.length > 0) {
                        showToast(`Ditemukan ${currentData.length} data siswa.`, "success");
                    }
                } else {
                    showToast(result.message || "Gagal mengambil data siswa.", "error");
                    displayResults([], category);
                }
            } catch (err) {
                console.error("Search Error:", err);
                showToast("Terjadi kesalahan koneksi ke server.", "error");
                displayResults([], category);
            } finally {
                toggleLoading(false);
            }
        }

        // Salin ringkasan data siswa ke clipboard
        function copyStudentInfo(siswa) {
            const gender = getGenderInfo(siswa.jenis_kelamin);
            const textToCopy = `=== DATA SISWA SMPN 1 BONDOWOSO ===\nNama: ${siswa.nama}\nNIS: ${siswa.nis}\nNISN: ${siswa.nisn}\nJenis Kelamin: ${gender.text}\nTTL: ${siswa.tempat_lahir}, ${siswa.tanggal_lahir}\nAgama: ${siswa.agama}\nKelas: ${siswa.kelas}\nAlamat: ${siswa.alamat}`;
            
            // Menggunakan Textarea Sementara untuk Keamanan iFrame & Cross-Browser
            const dummy = document.createElement("textarea");
            document.body.appendChild(dummy);
            dummy.value = textToCopy;
            dummy.select();
            document.execCommand("copy");
            document.body.removeChild(dummy);

            showToast("Data siswa berhasil disalin ke clipboard!", "success");
        }

        // Tampilkan Hasil Pencarian
        function displayResults(data, category) {
            const container = document.getElementById('resultContainer');
            const listView = document.getElementById('listView');
            const detailView = document.getElementById('detailView');
            const countBadge = document.getElementById('resultCount');

            listView.innerHTML = '';
            detailView.innerHTML = '';
            
            container.classList.remove('hidden');

            if (!data || data.length === 0) {
                countBadge.innerText = "0 Data";
                countBadge.className = "bg-rose-100 text-rose-700 text-xs font-bold px-3 py-1 rounded-full border border-rose-200";
                listView.classList.remove('hidden');
                detailView.classList.add('hidden');
                
                listView.innerHTML = `
                    <div class="col-span-full bg-white rounded-2xl shadow-sm border border-slate-200 p-10 text-center flex flex-col items-center justify-center">
                        <div class="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center mb-4 text-slate-400">
                            <i class="fas fa-search-minus text-3xl"></i>
                        </div>
                        <h3 class="text-lg font-bold text-slate-700 mb-1">Data Tidak Ditemukan</h3>
                        <p class="text-slate-500 text-xs sm:text-sm max-w-md">Tidak ada data siswa yang cocok dengan kata kunci pencarian Anda. Silakan periksa kembali ejaan atau coba kata kunci lain.</p>
                    </div>
                `;
                return;
            }

            countBadge.innerText = `${data.length} Data Ditemukan`;
            countBadge.className = "bg-blue-100 text-smp-blue text-xs font-bold px-3 py-1 rounded-full border border-blue-200";

            if (data.length === 1) {
                listView.classList.add('hidden');
                detailView.classList.remove('hidden');
                renderSingleDetail(data[0], detailView);
            } else {
                listView.classList.remove('hidden');
                detailView.classList.add('hidden');
                renderGridList(data, listView);
            }
        }

        // Render Daftar Banyak Data Siswa
        function renderGridList(data, container) {
            data.forEach((siswa, index) => {
                const gender = getGenderInfo(siswa.jenis_kelamin);

                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl shadow-sm hover:shadow-md transition-all border border-slate-200 overflow-hidden cursor-pointer group hover:-translate-y-0.5";
                card.onclick = () => openDetailFromList(index);
                
                card.innerHTML = `
                    <div class="flex p-4 items-center gap-4">
                        <div class="relative flex-shrink-0">
                            <img src="${siswa.foto}" alt="Foto ${siswa.nama}" class="w-16 h-20 object-cover rounded-xl border border-slate-200 group-hover:border-smp-light transition-colors" onerror="this.src='https://placehold.co/150x200/e2e8f0/64748b?text=Foto'">
                        </div>
                        <div class="flex-grow min-w-0">
                            <h4 class="font-bold text-slate-800 text-sm sm:text-base truncate mb-1 group-hover:text-smp-blue transition-colors">${siswa.nama}</h4>
                            <div class="text-xs text-slate-500 mb-2">NIS: ${siswa.nis} | Kelas: <span class="font-bold text-slate-700">${siswa.kelas}</span></div>
                            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${gender.badgeClass}">
                                <i class="fas ${gender.icon} mr-1"></i> ${gender.text}
                            </span>
                        </div>
                        <div class="flex-shrink-0 text-slate-300 group-hover:text-smp-light transition-colors">
                            <i class="fas fa-chevron-right"></i>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Buka Tampilan Detail Dari List
        function openDetailFromList(index) {
            const siswa = currentData[index];
            const listView = document.getElementById('listView');
            const detailView = document.getElementById('detailView');
            
            listView.classList.add('hidden');
            detailView.classList.remove('hidden');
            
            const backBtnHTML = `
                <button onclick="document.getElementById('detailView').classList.add('hidden'); document.getElementById('listView').classList.remove('hidden');" class="mb-4 inline-flex items-center text-xs sm:text-sm font-semibold text-slate-600 hover:text-smp-blue transition-colors bg-white px-4 py-2 rounded-xl shadow-sm border border-slate-200 hover:border-slate-300">
                    <i class="fas fa-arrow-left mr-2"></i> Kembali ke Daftar Siswa
                </button>
            `;
            
            renderSingleDetail(siswa, detailView, backBtnHTML);
        }

        // Render Tampilan Detail Profil Tunggal
        function renderSingleDetail(siswa, container, prependHTML = "") {
            const gender = getGenderInfo(siswa.jenis_kelamin);
            const safe = (val) => (val && val !== "-" && val.toString().trim() !== "") ? val : "-";

            const detailHTML = `
                ${prependHTML}
                <div class="bg-white rounded-3xl shadow-xl overflow-hidden border border-slate-200">
                    <!-- Header Kartu -->
                    <div class="bg-gradient-to-r from-smp-blue to-blue-600 px-6 py-5 flex flex-wrap justify-between items-center gap-3 text-white">
                        <div class="flex items-center gap-3">
                            <div class="p-2.5 bg-white/10 rounded-xl backdrop-blur-md border border-white/20">
                                <i class="fas fa-id-card text-xl"></i>
                            </div>
                            <div>
                                <h3 class="font-bold text-base sm:text-lg leading-tight">Profil Siswa</h3>
                                <p class="text-blue-100 text-xs">Data Resmi SMP Negeri 1 Bondowoso</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick='copyStudentInfo(${JSON.stringify(siswa).replace(/'/g, "&#39;")})' title="Salin Data" class="bg-white/10 hover:bg-white/20 text-white p-2.5 rounded-xl text-xs sm:text-sm font-semibold transition-all backdrop-blur-sm border border-white/20">
                                <i class="fas fa-copy mr-1"></i> Salin
                            </button>
                            <button onclick='generatePDFCard(${JSON.stringify(siswa).replace(/'/g, "&#39;")})' class="bg-white text-smp-blue hover:bg-blue-50 px-4 py-2.5 rounded-xl text-xs sm:text-sm font-bold shadow-md hover:shadow-lg transition-all flex items-center gap-2">
                                <i class="fas fa-print"></i> Cetak Kartu
                            </button>
                        </div>
                    </div>

                    <div class="p-6 md:p-8 flex flex-col md:flex-row gap-8">
                        <!-- Kolom Foto -->
                        <div class="w-full md:w-1/3 xl:w-1/4 flex flex-col items-center">
                            <div class="w-44 h-56 md:w-48 md:h-60 rounded-2xl overflow-hidden border-4 border-slate-100 shadow-md bg-slate-100 relative group">
                                <img src="${siswa.foto}" alt="Foto ${siswa.nama}" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105" onerror="this.src='https://placehold.co/300x400/e2e8f0/64748b?text=Belum+Ada+Foto'">
                            </div>
                        </div>

                        <!-- Kolom Data -->
                        <div class="w-full md:w-2/3 xl:w-3/4">
                            <div class="border-b border-slate-100 pb-4 mb-5">
                                <h2 class="text-2xl md:text-3xl font-extrabold text-slate-800 mb-3">${safe(siswa.nama)}</h2>
                                <div class="flex flex-wrap gap-2 items-center">
                                    <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold bg-slate-100 text-slate-700 border border-slate-200">
                                        <i class="fas fa-hashtag mr-1.5 text-slate-400"></i>NIS: ${safe(siswa.nis)}
                                    </span>
                                    <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold bg-slate-100 text-slate-700 border border-slate-200">
                                        <i class="fas fa-id-badge mr-1.5 text-slate-400"></i>NISN: ${safe(siswa.nisn)}
                                    </span>
                                    <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold border ${gender.badgeClass}">
                                        <i class="fas ${gender.icon} mr-1.5"></i>${gender.text}
                                    </span>
                                </div>
                            </div>

                            <div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-5">
                                <div class="space-y-1">
                                    <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Tempat, Tgl Lahir</span>
                                    <p class="text-slate-800 font-medium text-sm md:text-base">${safe(siswa.tempat_lahir)}, ${safe(siswa.tanggal_lahir)}</p>
                                </div>
                                <div class="space-y-1">
                                    <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Agama</span>
                                    <p class="text-slate-800 font-medium text-sm md:text-base">${safe(siswa.agama)}</p>
                                </div>
                                <div class="space-y-1 md:col-span-2">
                                    <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Alamat Lengkap</span>
                                    <p class="text-slate-800 font-medium text-sm md:text-base bg-slate-50 p-3.5 rounded-xl border border-slate-100 mt-1">${safe(siswa.alamat)}</p>
                                </div>
                                <div class="space-y-1">
                                    <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Kelas Saat Ini</span>
                                    <p class="text-slate-800 font-bold text-lg text-smp-light">${safe(siswa.kelas)}</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            container.innerHTML = detailHTML;
        }

        // Helper Konversi URL Gambar ke Base64
        function getBase64ImageFromUrl(imageUrl) {
            return new Promise((resolve) => {
                const img = new Image();
                img.crossOrigin = "Anonymous"; 
                img.onload = function () {
                    const canvas = document.createElement("canvas");
                    canvas.width = this.width;
                    canvas.height = this.height;
                    const ctx = canvas.getContext("2d");
                    ctx.drawImage(this, 0, 0);
                    try {
                        const dataURL = canvas.toDataURL("image/jpeg");
                        resolve(dataURL);
                    } catch (e) {
                        resolve(null);
                    }
                };
                img.onerror = function () {
                    resolve(null);
                };
                img.src = imageUrl;
            });
        }

        // Cetak PDF Kartu Pelajar
        async function generatePDFCard(siswa) {
            try {
                toggleLoading(true, "Membuat Kartu Pelajar PDF...");
                
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF({
                    orientation: 'landscape',
                    unit: 'mm',
                    format: [100, 65]
                });

                // --- Background & Kop Surat ---
                doc.setFillColor(30, 58, 138); // smp-blue
                doc.rect(0, 0, 100, 16, 'F');
                
                doc.setTextColor(255, 255, 255);
                doc.setFont("helvetica", "bold");
                doc.setFontSize(10);
                doc.text("KARTU DATA SISWA", 50, 5.5, { align: "center" });
                
                doc.setFontSize(8.5);
                doc.text("UPTD SPF SMP NEGERI 1 BONDOWOSO", 50, 9.5, { align: "center" });
                
                doc.setFont("helvetica", "normal");
                doc.setFontSize(4.5);
                doc.text("Jl. Letnan Karsono No.3, Kel. Blindungan, Kec. Bondowoso, Kabupaten Bondowoso, Jawa Timur 68212", 50, 13, { align: "center" });

                // --- Border Body ---
                doc.setDrawColor(30, 58, 138);
                doc.setLineWidth(0.3);
                doc.rect(2, 2, 96, 61);

                // --- Fetch Foto Siswa ---
                const fotoBase64 = await getBase64ImageFromUrl(siswa.foto);
                
                if (fotoBase64) {
                    doc.addImage(fotoBase64, 'JPEG', 5, 20, 22, 29);
                } else {
                    doc.setFillColor(230, 230, 230);
                    doc.rect(5, 20, 22, 29, 'F');
                    doc.setTextColor(150, 150, 150);
                    doc.setFontSize(6);
                    doc.text("FOTO", 16, 34, { align: "center" });
                }

                // --- Data Siswa ---
                doc.setTextColor(0, 0, 0);
                let yPos = 21;
                const leftM = 30;
                const colM = 48;
                const lineH = 4.2;

                const writeData = (label, value, isBold = false) => {
                    doc.setFont("helvetica", "normal");
                    doc.setFontSize(6.5);
                    doc.text(label, leftM, yPos);
                    doc.text(":", colM - 1, yPos);
                    doc.setFont("helvetica", isBold ? "bold" : "normal");
                    doc.text(value || "-", colM + 1, yPos, { maxWidth: 48 });
                    yPos += lineH;
                };

                const gender = getGenderInfo(siswa.jenis_kelamin);

                writeData("Nama Lengkap", siswa.nama, true);
                writeData("NIS / NISN", `${siswa.nis} / ${siswa.nisn}`);
                writeData("Tempat, Tgl Lahir", `${siswa.tempat_lahir}, ${siswa.tanggal_lahir}`);
                writeData("Jenis Kelamin", gender.text);
                writeData("Agama", siswa.agama);
                
                // Alamat
                doc.setFont("helvetica", "normal");
                doc.setFontSize(6.5);
                doc.text("Alamat", leftM, yPos);
                doc.text(":", colM - 1, yPos);
                const splitAlamat = doc.splitTextToSize(siswa.alamat || "-", 48);
                doc.text(splitAlamat, colM + 1, yPos);
                
                yPos += (splitAlamat.length * 3) + 1.5;

                // --- Pengesahan Bawah ---
                doc.setFontSize(6);
                doc.setFont("helvetica", "bold");
                doc.text(`Kelas: ${siswa.kelas}`, 5, 54);
                
                const tglSekarang = new Date();
                const textTgl = `Bondowoso, ${tglSekarang.getDate()} ${tglSekarang.toLocaleString('id-ID', { month: 'long' })} ${tglSekarang.getFullYear()}`;
                
                doc.setFont("helvetica", "normal");
                doc.text(textTgl, 83, 47, { align: "center" });
                doc.text("Kepala Sekolah", 83, 50, { align: "center" });
                
                doc.setFont("helvetica", "bold");
                doc.text("_______________________", 83, 58, { align: "center" });
                doc.text("NIP. .........................", 83, 61, { align: "center" });

                // --- Simpan PDF ---
                const safeName = (siswa.nama || "Siswa").replace(/[^a-z0-9]/gi, '_').toLowerCase();
                doc.save(`Kartu_Pelajar_${safeName}_${siswa.nis}.pdf`);
                
                showToast("Kartu Pelajar PDF berhasil diunduh!", "success");

            } catch (err) {
                console.error("PDF Generate Error:", err);
                showToast("Gagal mencetak kartu PDF. Pastikan jaringan stabil.", "error");
            } finally {
                toggleLoading(false);
            }
        }
    </script>
